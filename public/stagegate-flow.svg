<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>StageGate AI flow: brief, phases, invoice, safety lock, verify paid, buy, audit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#545d68"/>
    </marker>
  </defs>
  <rect width="960" height="250" rx="16" fill="#f5f7fa"/>

  <!-- Row: brief -> phases -> invoice -> lock -->
  <g font-size="14">
    <rect x="20" y="30" width="170" height="64" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
    <text x="105" y="56" text-anchor="middle" font-weight="700" fill="#001c64">AI Project Brief</text>
    <text x="105" y="76" text-anchor="middle" font-size="12" fill="#545d68">OpenAI → 2 phases</text>

    <rect x="250" y="30" width="170" height="64" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
    <text x="335" y="56" text-anchor="middle" font-weight="700" fill="#001c64">Channel3 sourcing</text>
    <text x="335" y="76" text-anchor="middle" font-size="12" fill="#545d68">real products, cart ≤ budget</text>

    <rect x="480" y="30" width="170" height="64" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
    <text x="565" y="56" text-anchor="middle" font-weight="700" fill="#001c64">PayPal invoice</text>
    <text x="565" y="76" text-anchor="middle" font-size="12" fill="#545d68">per phase, sent to client</text>

    <rect x="710" y="22" width="230" height="80" rx="10" fill="#c4122f"/>
    <text x="825" y="54" text-anchor="middle" font-weight="700" fill="#ffffff">🔒 Safety Lock</text>
    <text x="825" y="76" text-anchor="middle" font-size="12" fill="#ffffff">invoice not PAID → BLOCKED, $0.00</text>
  </g>
  <g stroke="#545d68" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="62" x2="246" y2="62"/>
    <line x1="420" y1="62" x2="476" y2="62"/>
    <line x1="650" y1="62" x2="706" y2="62"/>
    <path d="M825 102 V140"/>
  </g>

  <!-- Row: verify -> buy -> audit -> dashboard (right to left) -->
  <g font-size="14">
    <rect x="710" y="144" width="230" height="80" rx="10" fill="#00875a"/>
    <text x="825" y="176" text-anchor="middle" font-weight="700" fill="#ffffff">✓ PayPal says PAID</text>
    <text x="825" y="198" text-anchor="middle" font-size="12" fill="#ffffff">GET /v2/invoicing/invoices/{id}</text>

    <rect x="480" y="152" width="170" height="64" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
    <text x="565" y="178" text-anchor="middle" font-weight="700" fill="#001c64">Auto-buy supplies</text>
    <text x="565" y="198" text-anchor="middle" font-size="12" fill="#545d68">cart ≤ invoice → PayPal order</text>

    <rect x="250" y="152" width="170" height="64" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
    <text x="335" y="178" text-anchor="middle" font-weight="700" fill="#001c64">SHA-256 audit</text>
    <text x="335" y="198" text-anchor="middle" font-size="12" fill="#545d68">every allow / block, chained</text>

    <rect x="20" y="152" width="170" height="64" rx="10" fill="#001c64"/>
    <text x="105" y="178" text-anchor="middle" font-weight="700" fill="#ffffff">AG Studio</text>
    <text x="105" y="198" text-anchor="middle" font-size="12" fill="#ffffff">dashboard + AI assistant</text>
  </g>
  <g stroke="#545d68" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="710" y1="184" x2="654" y2="184"/>
    <line x1="480" y1="184" x2="424" y2="184"/>
    <line x1="250" y1="184" x2="194" y2="184"/>
  </g>
</svg>
